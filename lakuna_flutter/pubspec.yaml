name: lakuna_flutter
description: Lakuna, aplikasi kasir offline-first untuk UMKM Indonesia.
publish_to: none
version: 0.27.0+28

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  archive: ^4.6.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  forui: ^0.27.7
  go_router: ^18.1.2
  image_picker: ^1.2.2
  intl: any
  lakuna_client:
    path: ../lakuna_client
  lakuna_data:
    path: ../packages/lakuna_data
  lakuna_domain:
    path: ../packages/lakuna_domain
  material_ui: any
  path: any
  path_provider: ^2.1.6
  pdf: ^3.13.1
  print_bluetooth_thermal: ^1.2.5
  printing: ^5.15.1
  provider: ^6.1.5
  share_plus: ^13.3.1
  tabler_icons_plus: ^3.50.0
  vyuh_node_flow: ^0.32.0
  xml: ^7.0.0

dev_dependencies:
  # Dipakai agen untuk menjalankan aplikasi lewat Dart MCP (lib/driver.dart).
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  forui_cli: ^0.27.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Instans statis untuk PDF kuitansi (paket pdf tidak membaca font variabel).
    - assets/fonts/pdf/
    # Panduan pengguna offline (F1-21).
    - assets/guide/
    - assets/guide/id/
    - assets/guide/en/
    - assets/guide/img/id/
    - assets/guide/img/en/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Italic.ttf
          style: italic
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DM_Sans/DMSans.ttf
        - asset: assets/fonts/DM_Sans/DMSans-Italic.ttf
          style: italic
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DM_Mono/DMMono-Regular.ttf
        - asset: assets/fonts/DM_Mono/DMMono-Medium.ttf
          weight: 500

name: lakuna_flutter
description: Lakuna, aplikasi kasir offline-first untuk UMKM Indonesia.
publish_to: none
version: 0.9.0+10

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  forui: ^0.27.7
  go_router: ^18.1.2
  intl: any
  lakuna_client:
    path: ../lakuna_client
  lakuna_data:
    path: ../packages/lakuna_data
  lakuna_domain:
    path: ../packages/lakuna_domain
  material_ui: any
  path: any
  path_provider: ^2.1.6
  pdf: ^3.13.1
  print_bluetooth_thermal: ^1.2.5
  printing: ^5.15.1
  provider: ^6.1.5
  tabler_icons_plus: ^3.50.0

dev_dependencies:
  # Dipakai agen untuk menjalankan aplikasi lewat Dart MCP (lib/driver.dart).
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  forui_cli: ^0.27.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Italic.ttf
          style: italic
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DM_Sans/DMSans.ttf
        - asset: assets/fonts/DM_Sans/DMSans-Italic.ttf
          style: italic
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DM_Mono/DMMono-Regular.ttf
        - asset: assets/fonts/DM_Mono/DMMono-Medium.ttf
          weight: 500

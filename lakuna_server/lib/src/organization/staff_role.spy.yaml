### Role staf yang izinnya diatur di matriks 1.25 (F1-17). Role bawaan baru
### disimpan saat izinnya diubah pertama kali; role `owner` tidak pernah
### disimpan. `permissionKeys` = kunci `resource:action` dipisah koma.
class: StaffRole
table: roles
database: all
fields:
  id: UuidValue, defaultModel=random_v7
  tenantId: UuidValue, relation(parent=tenants, onDelete=Restrict), column=tenant_id
  roleKey: String, column=role_key
  name: String
  permissionKeys: String, column=permission_keys
  createdAt: DateTime, default=now, column=created_at
  updatedAt: DateTime, default=now, column=updated_at
  deletedAt: DateTime?, column=deleted_at
  createdBy: UuidValue?, column=created_by
  updatedBy: UuidValue?, column=updated_by
  version: int, default=1
  hlc: String
  originDeviceId: UuidValue?, column=origin_device_id
indexes:
  roles_tenant_key_idx:
    fields: tenantId, roleKey
    unique: true

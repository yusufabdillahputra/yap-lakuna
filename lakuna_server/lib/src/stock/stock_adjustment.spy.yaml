### Dokumen penyesuaian stok (F1-08), nomor `SA-<OUTLET>-<PERANGKAT>-<yymmdd>-<nnnn>`.
### Setiap baris berselisih membuat satu pergerakan `adjustment` di ledger.
class: StockAdjustment
table: stock_adjustments
database: all
fields:
  id: UuidValue, defaultModel=random_v7
  tenantId: UuidValue, relation(parent=tenants, onDelete=Restrict), column=tenant_id
  outletId: UuidValue, relation(parent=outlets, onDelete=Restrict), column=outlet_id
  stockLocationId: UuidValue, relation(parent=stock_locations, onDelete=Restrict), column=stock_location_id
  number: String
  reason: StockAdjustmentReason
  note: String?
  ### Jumlah nilai selisih (rupiah, bertanda; negatif = rugi).
  totalValue: int, column=total_value
  staffId: UuidValue, relation(parent=staff_members, onDelete=Restrict), column=staff_id
  adjustedAt: DateTime, column=adjusted_at
  createdAt: DateTime, default=now, column=created_at
  updatedAt: DateTime, default=now, column=updated_at
  deletedAt: DateTime?, column=deleted_at
  createdBy: UuidValue?, column=created_by
  updatedBy: UuidValue?, column=updated_by
  version: int, default=1
  hlc: String
  originDeviceId: UuidValue?, column=origin_device_id
indexes:
  stock_adjustments_outlet_idx:
    fields: outletId, adjustedAt
  stock_adjustments_number_idx:
    fields: tenantId, number
    unique: true

### Baris yang kalah atau ditolak saat push (F2-01 aturan 6, 7a, 8a), untuk
### ditinjau di F2-03. Hanya ada di server.
class: SyncConflict
table: sync_conflicts
database: server
serverOnly: true
fields:
  tenantId: UuidValue, relation(parent=tenants, onDelete=Restrict), column=tenant_id
  ### Nama tabel (`tableName` dipakai Serverpod).
  entity: String, column=table_name
  rowId: UuidValue, column=row_id
  ### HLC baris server yang menang; null bila baris server tidak ada.
  winnerHlc: String?, column=winner_hlc
  loserHlc: String, column=loser_hlc
  loserDeviceId: UuidValue?, column=loser_device_id
  loserPayloadJson: String, column=loser_payload_json
  ### `lww`, `final`, `unique`, atau `merged`.
  reason: String
  createdAt: DateTime, default=now, column=created_at
  resolvedAt: DateTime?, column=resolved_at
indexes:
  sync_conflicts_tenant_idx:
    fields: tenantId, createdAt

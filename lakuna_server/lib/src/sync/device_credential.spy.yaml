### Token perangkat versi hosting (F2-01 aturan 11). Server hanya menyimpan
### hash SHA-256 token. Hanya ada di server.
class: DeviceCredential
table: device_credentials
database: server
serverOnly: true
fields:
  tenantId: UuidValue, relation(parent=tenants, onDelete=Restrict), column=tenant_id
  deviceId: UuidValue, column=device_id
  tokenHash: String, column=token_hash
  createdAt: DateTime, default=now, column=created_at
  lastSeenAt: DateTime?, column=last_seen_at
  revokedAt: DateTime?, column=revoked_at
indexes:
  device_credentials_token_idx:
    fields: tokenHash
    unique: true
  device_credentials_device_idx:
    fields: deviceId

### Nota penjualan (F1-04/F1-05). Nomor memuat kode cabang dan perangkat
### (`PST-K01-261103-0001`) agar unik tanpa koordinasi saat sync.
class: Sale
table: sales
database: all
fields:
  id: UuidValue, defaultModel=random_v7
  tenantId: UuidValue, relation(parent=tenants, onDelete=Restrict), column=tenant_id
  outletId: UuidValue, relation(parent=outlets, onDelete=Restrict), column=outlet_id
  deviceId: UuidValue, relation(parent=devices, onDelete=Restrict), column=device_id
  cashSessionId: UuidValue?, relation(parent=cash_sessions, onDelete=Restrict), column=cash_session_id
  staffId: UuidValue, relation(parent=staff_members, onDelete=Restrict), column=staff_id
  number: String
  status: SaleStatus
  ### Σ harga daftar × jumlah (sebelum grosir), rupiah.
  subtotal: int
  tierDiscount: int, column=tier_discount
  total: int
  paidAmount: int, column=paid_amount
  changeAmount: int, column=change_amount
  ### Jumlah baris item.
  itemCount: int, column=item_count
  soldAt: DateTime, column=sold_at
  ### F&B (F1-10). Open bill memakai nomor bill `OB-…` di [number] sampai
  ### lunas; nomor bill tetap di [billNumber].
  orderType: OrderType, default=retail, column=order_type
  diningTableId: UuidValue?, relation(parent=dining_tables, onDelete=Restrict), column=dining_table_id
  billNumber: String?, column=bill_number
  ### Nomor take away harian per perangkat (`TA-07`).
  queueNumber: int?, column=queue_number
  customerName: String?, column=customer_name
  guestCount: int?, column=guest_count
  openedBy: UuidValue?, column=opened_by
  openedAt: DateTime?, column=opened_at
  billRequestedAt: DateTime?, column=bill_requested_at
  ### Tarif dan nominal service/PB1, dibekukan saat lunas.
  serviceBp: int, default=0, column=service_bp
  taxBp: int, default=0, column=tax_bp
  serviceAmount: int, default=0, column=service_amount
  taxAmount: int, default=0, column=tax_amount
  ### PB1 sudah termasuk harga (F1-18): tax_amount dipisahkan, bukan ditambah.
  taxInclusive: bool, default=false, column=tax_inclusive
  ### Selisih pembulatan total (F1-18), termasuk dalam total; boleh negatif.
  roundingAmount: int, default=0, column=rounding_amount
  ### Kelipatan pembulatan total yang dipakai (1/100/500, F1-10h). Pada bill
  ### terbuka, > 0 berarti tarif service/PB1/pembulatan sudah dibekukan
  ### karena ada pembayaran bagian split; 0 = ikut tarif cabang terkini.
  roundingStep: int, default=0, column=rounding_step
  ### Diskon manual nota (F1-04b) dalam rupiah, dari jumlah total baris.
  discountAmount: int, default=0, column=discount_amount
  ### Persen diskon nota (basis poin); 0 bila diskon rupiah.
  discountBp: int, default=0, column=discount_bp
  ### Jumlah diskon manual semua baris (untuk laporan).
  lineDiscountAmount: int, default=0, column=line_discount_amount
  ### Staf yang menyetujui diskon manual lewat PIN; null bila staf sendiri berizin.
  discountApprovedBy: UuidValue?, column=discount_approved_by
  voidReason: String?, column=void_reason
  voidedBy: UuidValue?, column=voided_by
  voidedAt: DateTime?, column=voided_at
  ### Split bill (F1-10c): mode dan jumlah tamu (2–8, label A–H).
  splitMode: SplitMode?, column=split_mode
  splitGuests: int?, column=split_guests
  ### Kredit (F1-13): pelanggan dan jatuh tempo piutang. Sisa piutang =
  ### total − [paidAmount] − alokasi pembayaran − pengurang retur.
  customerId: UuidValue?, relation(parent=customers, onDelete=Restrict), column=customer_id
  dueOn: DateTime?, column=due_on
  createdAt: DateTime, default=now, column=created_at
  updatedAt: DateTime, default=now, column=updated_at
  deletedAt: DateTime?, column=deleted_at
  createdBy: UuidValue?, column=created_by
  updatedBy: UuidValue?, column=updated_by
  version: int, default=1
  hlc: String
  originDeviceId: UuidValue?, column=origin_device_id
indexes:
  sales_number_idx:
    fields: tenantId, number
    unique: true
  sales_session_idx:
    fields: cashSessionId
  sales_outlet_sold_idx:
    fields: outletId, soldAt
  sales_outlet_status_idx:
    fields: outletId, status
  sales_customer_idx:
    fields: customerId

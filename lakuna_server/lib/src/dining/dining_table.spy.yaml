### Meja F&B per cabang (F1-10). Posisi, ukuran, dan bentuk di denah dalam
### satuan dunia denah (lebar 800); `pos_x`/`pos_y` kosong = belum ditempatkan.
class: DiningTable
table: dining_tables
database: all
fields:
  id: UuidValue, defaultModel=random_v7
  tenantId: UuidValue, relation(parent=tenants, onDelete=Restrict), column=tenant_id
  outletId: UuidValue, relation(parent=outlets, onDelete=Restrict), column=outlet_id
  diningAreaId: UuidValue?, relation(parent=dining_areas, onDelete=Restrict), column=dining_area_id
  name: String
  seats: int, default=4
  sortOrder: int, default=0, column=sort_order
  shape: TableShape, default=square
  posX: int?, column=pos_x
  posY: int?, column=pos_y
  width: int, default=80
  height: int, default=80
  canMerge: bool, default=false, column=can_merge
  createdAt: DateTime, default=now, column=created_at
  updatedAt: DateTime, default=now, column=updated_at
  deletedAt: DateTime?, column=deleted_at
  createdBy: UuidValue?, column=created_by
  updatedBy: UuidValue?, column=updated_by
  version: int, default=1
  hlc: String
  originDeviceId: UuidValue?, column=origin_device_id
indexes:
  dining_tables_outlet_idx:
    fields: outletId

### Sesi kasir satu perangkat: saldo awal, lalu hitung uang fisik dan selisih
### saat tutup (F1-03). Satu sesi terbuka per perangkat.
class: CashSession
table: cash_sessions
database: all
fields:
  id: UuidValue, defaultModel=random_v7
  tenantId: UuidValue, relation(parent=tenants, onDelete=Restrict), column=tenant_id
  outletId: UuidValue, relation(parent=outlets, onDelete=Restrict), column=outlet_id
  deviceId: UuidValue, relation(parent=devices, onDelete=Restrict), column=device_id
  status: CashSessionStatus
  openedBy: UuidValue, relation(parent=staff_members, onDelete=Restrict), column=opened_by
  openedAt: DateTime, column=opened_at
  ### Saldo awal laci (rupiah).
  openingCash: int, column=opening_cash
  openingNote: String?, column=opening_note
  closedBy: UuidValue?, relation(parent=staff_members, onDelete=Restrict), column=closed_by
  closedAt: DateTime?, column=closed_at
  ### Seharusnya di laci saat tutup (rupiah).
  expectedCash: int?, column=expected_cash
  ### Hasil hitung uang fisik (rupiah).
  countedCash: int?, column=counted_cash
  ### Hitung - seharusnya: positif lebih, negatif kurang.
  difference: int?
  ### Rincian hitung per pecahan (JSON `CashCount`).
  countedBreakdown: String?, column=counted_breakdown
  closingNote: String?, column=closing_note
  createdAt: DateTime, default=now, column=created_at
  updatedAt: DateTime, default=now, column=updated_at
  deletedAt: DateTime?, column=deleted_at
  createdBy: UuidValue?, column=created_by
  updatedBy: UuidValue?, column=updated_by
  version: int, default=1
  hlc: String
  originDeviceId: UuidValue?, column=origin_device_id
indexes:
  cash_sessions_device_status_idx:
    fields: deviceId, status
